services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_mgmt
    # Published only for local tooling. Coolify proxy does not need host ports.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_mgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/customer_mgmt?schema=public
      JWT_SECRET: change-me-in-production-use-a-long-random-string
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CRM_BASE_DOMAIN: crm.dabriz.com
      CRM_PROTOCOL: https
      ADMIN_EMAIL: admin@dabriz.com
      ADMIN_PASSWORD: Admin123!
      CORS_ORIGIN: https://customers-front.dabriz.com
      OAUTH_ISSUER: https://customers-backend.dabriz.com
      OAUTH_TOKEN_SECRET: change-me-oauth-token-secret
      SSO_FRONTEND_URL: https://customers-front.dabriz.com
      OAUTH_CRM_CLIENT_ID: multi-tenant-crm
      OAUTH_CRM_CLIENT_SECRET: crm-dev-client-secret-change-me
      OAUTH_CRM_REDIRECT_URIS: https://api.crm.dabriz.com/auth/sso/callback
      CRM_API_URL: https://api.crm.dabriz.com
      CRM_PROVISIONING_SECRET: shared-provisioning-secret-change-me
      RUN_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      - coolify.managed=true
      - coolify.http.domain=customers-backend.dabriz.com

volumes:
  postgres_data:
